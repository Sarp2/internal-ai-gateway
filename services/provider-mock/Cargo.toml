[package]
name = "provider-mock-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
